# Keep replicas: 1 — with more than one replica every scheduled job would
# fire once per pod (no leader election is implemented yet).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-scheduler
  namespace: pulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse-scheduler
  template:
    metadata:
      labels:
        app: pulse-scheduler
    spec:
      # Run schema migrations before reaping (audit finding #6). The
      # scheduler image keeps pulse-api (incl. alembic.ini) under /app/pulse-api.
      initContainers:
        - name: migrate
          image: ondemandworld/pulse-scheduler:latest
          command: ["sh", "-c", "cd /app/pulse-api && alembic upgrade head"]
          envFrom:
            - configMapRef:
                name: pulse-config
            - secretRef:
                name: pulse-secrets
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+asyncpg://pulse:$(POSTGRES_PASSWORD)@postgres:5432/pulse"
      containers:
        - name: pulse-scheduler
          image: ondemandworld/pulse-scheduler:latest
          envFrom:
            - configMapRef:
                name: pulse-config
            - secretRef:
                name: pulse-secrets
          env:
            # $(VAR) expansion only resolves vars defined earlier in this env
            # list — NOT envFrom vars (audit finding #5).
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+asyncpg://pulse:$(POSTGRES_PASSWORD)@postgres:5432/pulse"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
