apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-ui
  namespace: pulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulse-ui
  template:
    metadata:
      labels:
        app: pulse-ui
    spec:
      containers:
        - name: pulse-ui
          image: ondemandworld/pulse-ui:latest
          ports:
            - containerPort: 80
          env:
            # Upstream for the nginx /api proxy (see pulse-ui/nginx.conf.template).
            # The in-cluster pulse-api Service listens on port 80.
            - name: API_UPSTREAM
              value: "http://pulse-api:80"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-ui
  namespace: pulse
spec:
  selector:
    app: pulse-ui
  ports:
    - port: 80
      targetPort: 80
