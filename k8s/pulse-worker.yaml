apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-worker
  namespace: pulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulse-worker
  template:
    metadata:
      labels:
        app: pulse-worker
    spec:
      # Shared bulk-job payloads with pulse-api (audit finding #7).
      volumes:
        - name: bulk-uploads
          persistentVolumeClaim:
            claimName: pulse-bulk-uploads
        - name: bulk-outputs
          persistentVolumeClaim:
            claimName: pulse-bulk-outputs
      # Run schema migrations before consuming (audit finding #6). The
      # worker image keeps pulse-api (incl. alembic.ini) under /app/pulse-api.
      initContainers:
        - name: migrate
          image: ondemandworld/pulse-worker:latest
          command: ["sh", "-c", "cd /app/pulse-api && alembic upgrade head"]
          envFrom:
            - configMapRef:
                name: pulse-config
            - secretRef:
                name: pulse-secrets
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+asyncpg://pulse:$(POSTGRES_PASSWORD)@postgres:5432/pulse"
      containers:
        - name: pulse-worker
          image: ondemandworld/pulse-worker:latest
          envFrom:
            - configMapRef:
                name: pulse-config
            - secretRef:
                name: pulse-secrets
          env:
            # $(VAR) expansion only resolves vars defined earlier in this env
            # list — NOT envFrom vars (audit finding #5).
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+asyncpg://pulse:$(POSTGRES_PASSWORD)@postgres:5432/pulse"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          volumeMounts:
            - name: bulk-uploads
              mountPath: /tmp/pulse_bulk_uploads
            - name: bulk-outputs
              mountPath: /tmp/pulse_bulk_outputs
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
