# Example Secret for local/dev clusters. DO NOT apply real credentials to a
# cluster from a checked-in file — copy this, fill in real values, and apply
# out-of-band (or use sealed-secrets / external-secrets).
#
# Key names must match the environment variable names the app reads
# (pulse-api/src/pulse/config.py): envFrom exposes each key verbatim, and
# k8s $(VAR) expansion in the app manifests expects POSTGRES_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: pulse-secrets
  namespace: pulse
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  PULSE_SECRET_KEY: "change-me-in-production"
  WEBHOOK_SIGNING_SECRET: "whsec_change_me"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  STORAGE_ACCESS_KEY: ""
  STORAGE_SECRET_KEY: ""
