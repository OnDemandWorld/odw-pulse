# Example Secret for local/dev clusters. DO NOT apply real credentials to a
# cluster from a checked-in file — copy this, fill in real values, and apply
# out-of-band (or use sealed-secrets / external-secrets).
#
# Key names must match the environment variable names the app reads
# (pulse-api/src/pulse/config.py): envFrom exposes each key verbatim, and
# k8s $(VAR) expansion in the app manifests expects POSTGRES_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: pulse-secrets
  namespace: pulse
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  # Privileged connection for pre-auth lookups (login/registration). Empty
  # falls back to DATABASE_URL. Becomes *mandatory* once RLS is enforced with
  # a scoped app role (BUILD_REPORT H-1): only this role can read users
  # before a workspace context exists. Full asyncpg URL, e.g.
  # postgresql+asyncpg://pulse_admin:<admin-password>@postgres:5432/pulse
  DATABASE_ADMIN_URL: ""
  PULSE_SECRET_KEY: "change-me-in-production"
  WEBHOOK_SIGNING_SECRET: "whsec_change_me"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  STORAGE_ACCESS_KEY: ""
  STORAGE_SECRET_KEY: ""
