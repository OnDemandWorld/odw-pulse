# Example Secret for local/dev clusters. DO NOT apply real credentials to a
# cluster from a checked-in file — copy this, fill in real values, and apply
# out-of-band (or use sealed-secrets / external-secrets).
#
# REQUIRED STEPS (audit finding #38):
#   1. cp k8s/secrets.example.yaml k8s/secrets.yaml   (secrets.yaml is gitignored)
#   2. Replace EVERY "change-me*" value, e.g.:
#        openssl rand -base64 32   # for PULSE_SECRET_KEY / WEBHOOK_SIGNING_SECRET
#   3. kubectl apply -f k8s/secrets.yaml
# Applying this file UNCHANGED with the shipped ConfigMap (PULSE_ENV=production)
# makes pulse-api CrashLoopBackOff BY DESIGN: create_app() refuses to start in
# production with the default PULSE_SECRET_KEY / WEBHOOK_SIGNING_SECRET.
# For a local dev cluster, either set real random values or patch the
# ConfigMap's PULSE_ENV to "development" (default secrets are then replaced
# with ephemeral per-process values — never use that mode exposed to users).
#
# Key names must match the environment variable names the app reads
# (pulse-api/src/pulse/config.py): envFrom exposes each key verbatim, and
# k8s $(VAR) expansion in the app manifests expects POSTGRES_PASSWORD and
# REDIS_PASSWORD to be defined via secretKeyRef in the env list.
apiVersion: v1
kind: Secret
metadata:
  name: pulse-secrets
  namespace: pulse
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  # Redis requirepass (audit finding #40); referenced by REDIS_URL in the
  # app manifests and by the redis StatefulSet itself.
  REDIS_PASSWORD: "change-me-redis"
  # Privileged connection for pre-auth lookups (login/registration). Empty
  # falls back to DATABASE_URL. Becomes *mandatory* once RLS is enforced with
  # a scoped app role (BUILD_REPORT H-1): only this role can read users
  # before a workspace context exists. Full asyncpg URL, e.g.
  # postgresql+asyncpg://pulse_admin:<admin-password>@postgres:5432/pulse
  DATABASE_ADMIN_URL: ""
  PULSE_SECRET_KEY: "change-me-in-production"
  WEBHOOK_SIGNING_SECRET: "whsec_change_me"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  STORAGE_ACCESS_KEY: ""
  STORAGE_SECRET_KEY: ""
