apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse
  namespace: pulse
  # NOTE: no rewrite-target — /api/v1/* must reach pulse-api unmodified
  # (routers are mounted at /api/v1), and /* must reach the UI as-is.
spec:
  rules:
    - host: pulse.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pulse-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse-ui
                port:
                  number: 80
