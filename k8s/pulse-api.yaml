apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-api
  namespace: pulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulse-api
  template:
    metadata:
      labels:
        app: pulse-api
    spec:
      # Shared bulk-job payloads with pulse-worker (audit finding #7).
      volumes:
        - name: bulk-uploads
          persistentVolumeClaim:
            claimName: pulse-bulk-uploads
        - name: bulk-outputs
          persistentVolumeClaim:
            claimName: pulse-bulk-outputs
      # Run schema migrations before serving (audit finding #6).
      initContainers:
        - name: migrate
          image: ondemandworld/pulse-api:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: pulse-config
            - secretRef:
                name: pulse-secrets
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+asyncpg://pulse:$(POSTGRES_PASSWORD)@postgres:5432/pulse"
      containers:
        - name: pulse-api
          image: ondemandworld/pulse-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: pulse-config
            - secretRef:
                name: pulse-secrets
          env:
            # $(VAR) expansion only resolves vars defined earlier in this env
            # list — NOT envFrom vars (audit finding #5). Define the password
            # explicitly via secretKeyRef before interpolating it.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+asyncpg://pulse:$(POSTGRES_PASSWORD)@postgres:5432/pulse"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          volumeMounts:
            - name: bulk-uploads
              mountPath: /tmp/pulse_bulk_uploads
            - name: bulk-outputs
              mountPath: /tmp/pulse_bulk_outputs
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-api
  namespace: pulse
spec:
  selector:
    app: pulse-api
  ports:
    - port: 80
      targetPort: 8000
