services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot schema migration (audit finding #6): runs alembic before any
  # app service starts. App services gate on its successful completion.
  migrate:
    build:
      context: ./pulse-api
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://pulse:pulse@postgres:5432/pulse
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  pulse-api:
    build:
      context: ./pulse-api
      dockerfile: Dockerfile
    # Loopback-only publish (audit findings #52/#69): the UI nginx proxy
    # reaches the API over the compose network; direct external access to
    # the unproxied API (spoofable XFF, no body limit) is closed off.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PULSE_ENV: development
      DATABASE_URL: postgresql+asyncpg://pulse:pulse@postgres:5432/pulse
      # Pre-auth (login/register) lookups run on this privileged connection;
      # empty falls back to DATABASE_URL (the env_file below passes it through
      # when set). Point it at a dedicated admin role once RLS is enforced:
      # DATABASE_ADMIN_URL: postgresql+asyncpg://pulse_admin:...@postgres:5432/pulse
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_USE_SSL: "false"
    env_file:
      - path: .env
        required: false
    # Shared with pulse-worker so uploaded CSVs and result files are visible
    # to both processes (audit finding #7). Paths must match worker.tasks.
    volumes:
      - bulk_uploads:/tmp/pulse_bulk_uploads
      - bulk_outputs:/tmp/pulse_bulk_outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  pulse-worker:
    build:
      context: .
      dockerfile: pulse-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://pulse:pulse@postgres:5432/pulse
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    # Same shared volumes as pulse-api (audit finding #7).
    volumes:
      - bulk_uploads:/tmp/pulse_bulk_uploads
      - bulk_outputs:/tmp/pulse_bulk_outputs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  pulse-scheduler:
    build:
      context: .
      dockerfile: pulse-scheduler/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://pulse:pulse@postgres:5432/pulse
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  pulse-ui:
    build:
      context: ./pulse-ui
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      # Upstream the nginx container proxies /api requests to (in-cluster or
      # compose service DNS names, not localhost).
      API_UPSTREAM: http://pulse-api:8000
    depends_on:
      pulse-api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  # Bulk-job input/output payloads shared between pulse-api and pulse-worker
  # (audit finding #7).
  bulk_uploads:
  bulk_outputs:
