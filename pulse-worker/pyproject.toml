[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulse-worker"
version = "0.1.0"
description = "Pulse async worker for bulk generation jobs"
requires-python = ">=3.11"
# NOTE: at runtime the worker also needs pulse-api (it consumes the
# pulse.worker/pulse.generation pipeline). pulse-api is not on PyPI, so it is
# installed alongside this package: `pip install ./pulse-api ./pulse-worker`
# in Docker, or `make install` for local development.
dependencies = [
    "redis>=5.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pulse_worker"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
